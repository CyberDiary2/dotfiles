conky.config = {
    alignment = 'top_right',
    gap_x = 20,
    gap_y = 50,
    background = false,
    border_width = 0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = false,
    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=10',
    override_utf8_locale = true,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    stippled_borders = 0,
    update_interval = 2,
    uppercase = false,
    use_spacer = 'none',
    minimum_width = 220,
}

conky.text = [[
${color #5a8c50}SYSTEM ${color #3a5c30}${hr 1}
${color #c8e6a0}Host:    ${color #61d29d}${nodename}
${color #c8e6a0}OS:      ${color #61d29d}${sysname} ${kernel}
${color #c8e6a0}Uptime:  ${color #61d29d}${uptime}

${color #5a8c50}CPU ${color #3a5c30}${hr 1}
${color #c8e6a0}${cpu cpu0}%  ${color #3a5c30}${cpubar cpu0 8,220}
${color #c8e6a0}Temp:    ${color #61d29d}${hwmon 0 temp 1}°C
${color #c8e6a0}Freq:    ${color #61d29d}${freq_g}GHz

${color #5a8c50}MEMORY ${color #3a5c30}${hr 1}
${color #c8e6a0}RAM:     ${color #61d29d}${mem} / ${memmax}
${color #c8e6a0}${color #3a5c30}${membar 8,220}
${color #c8e6a0}Swap:    ${color #61d29d}${swap} / ${swapmax}

${color #5a8c50}DISK ${color #3a5c30}${hr 1}
${color #c8e6a0}Root:    ${color #61d29d}${fs_used /} / ${fs_size /}
${color #3a5c30}${fs_bar 8,220 /}

${color #5a8c50}NETWORK ${color #3a5c30}${hr 1}
${color #c8e6a0}Up:      ${color #61d29d}${upspeed}
${color #c8e6a0}Down:    ${color #61d29d}${downspeed}
${color #c8e6a0}IP:      ${color #61d29d}${addr eth0}

${color #5a8c50}PROCESSES ${color #3a5c30}${hr 1}
${color #c8e6a0}Total:   ${color #61d29d}${processes}  Running: ${running_processes}
${color #c8e6a0}${top name 1}  ${color #61d29d}${top cpu 1}%
${color #c8e6a0}${top name 2}  ${color #61d29d}${top cpu 2}%
${color #c8e6a0}${top name 3}  ${color #61d29d}${top cpu 3}%
]]
